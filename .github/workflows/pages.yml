name: Docs site

# Builds the docs site (client/) as a static export and deploys it to GitHub Pages. It does nothing until you turn it on:
# set Settings > Pages > Source to "GitHub Actions", then add a repository variable named ENABLE_PAGES with the value
# true. The export also runs on any other static host: see client/README.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    if: vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package/package-lock.json
            client/package-lock.json

      - name: Package - install and build
        working-directory: package
        run: |
          npm ci
          npm run build

      - name: Docs - install
        working-directory: client
        run: npm ci

      - name: Docs - build the static export
        working-directory: client
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
