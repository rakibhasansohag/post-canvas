name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package/package-lock.json
            client/package-lock.json

      - name: Package - install
        working-directory: package
        run: npm ci

      - name: Package - lint
        working-directory: package
        run: npm run lint

      - name: Package - typecheck
        working-directory: package
        run: npm run typecheck

      - name: Package - test
        working-directory: package
        run: npm test

      - name: Package - build
        working-directory: package
        run: npm run build

      - name: Docs - install
        working-directory: client
        run: npm ci

      - name: Docs - lint
        working-directory: client
        run: npm run lint

      - name: Docs - typecheck
        working-directory: client
        run: npm run typecheck

      - name: Docs - build
        working-directory: client
        run: npm run build
